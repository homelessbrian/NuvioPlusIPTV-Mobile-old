name: Copy secrets to fork (one time)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Repo to copy the secrets into"
        default: "homelessbrian/NuvioPlusIPTV-Mobile"
        required: true

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy every secret
        env:
          GH_TOKEN: ${{ secrets.COPY_TOKEN }}
          TARGET: ${{ inputs.target }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          LIVETV_TESTER_KEY: ${{ secrets.LIVETV_TESTER_KEY }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          NUVIO_BACKEND_KEY: ${{ secrets.NUVIO_BACKEND_KEY }}
          NUVIO_BACKEND_URL: ${{ secrets.NUVIO_BACKEND_URL }}
          NUVIO_RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          SIMKL_APP_NAME: ${{ secrets.SIMKL_APP_NAME }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TEST_BUILDS_PUBLISH_TOKEN: ${{ secrets.TEST_BUILDS_PUBLISH_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Add the COPY_TOKEN secret first"; exit 1; fi
          if [ "$TARGET" = "$GITHUB_REPOSITORY" ]; then echo "::error::Target is this same repo"; exit 1; fi
          copied=0; skipped=""
          for name in GOOGLE_DRIVE_CLIENT_ID GOOGLE_DRIVE_CLIENT_SECRET IMDB_RATINGS_API_BASE_URL IMDB_TAPFRAME_API_BASE_URL INTRODB_API_URL LIVETV_TESTER_KEY MDBLIST_CLIENT_ID NUVIO_BACKEND_KEY NUVIO_BACKEND_URL NUVIO_RELEASE_KEYSTORE_BASE64 NUVIO_RELEASE_KEY_ALIAS NUVIO_RELEASE_KEY_PASSWORD NUVIO_RELEASE_STORE_PASSWORD PREMIUMIZE_CLIENT_ID SIMKL_APP_NAME SIMKL_CLIENT_ID SYNC_TOKEN TEST_BUILDS_PUBLISH_TOKEN TMDB_API_KEY TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET; do
            value="${!name}"
            if [ -z "$value" ]; then skipped="$skipped $name"; continue; fi
            printf '%s' "$value" | gh secret set "$name" -R "$TARGET"
            copied=$((copied+1))
          done
          echo "Copied $copied secrets to $TARGET"
          if [ -n "$skipped" ]; then echo "Not set in this repo (skipped):$skipped"; fi
